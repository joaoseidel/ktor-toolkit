version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    # These land in the published POMs, and Gradle resolves the highest version anyone asks for,
    # so a bump here moves every consumer's app along with it. Patches flow; a minor or major is a
    # deliberate floor change with a CHANGELOG line.
    ignore:
      - dependency-name: "io.ktor:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-datetime"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
