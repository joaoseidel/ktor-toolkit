name: Snapshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Snapshots are disposable — a newer commit on main makes an in-flight upload pointless.
concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    name: Publish snapshot
    runs-on: ubuntu-latest

    # Separate from the `maven-central` environment on purpose: snapshots should not need a
    # reviewer on every merge, and release credentials stay behind their own gate.
    environment:
      name: maven-central-snapshots
      url: https://central.sonatype.com/repository/maven-snapshots/io/github/joaoseidel/

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the version guard below reads the tag list

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # gradle.properties holds the *next* version to be released, so main's snapshot is that
      # version with a -SNAPSHOT suffix. If the tag already exists the version was not bumped
      # after the release, and publishing would advertise a stale snapshot.
      - name: Resolve snapshot version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::notice::v$version is already released — bump the version in gradle.properties to resume snapshots"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "value=$version-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        if: steps.version.outputs.skip == 'false'
        run: make verify

      # Snapshots are signed like releases so consumers can verify them the same way.
      - name: Publish snapshot to Maven Central
        if: steps.version.outputs.skip == 'false'
        env:
          SNAPSHOT_VERSION: ${{ steps.version.outputs.value }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral -Pversion="$SNAPSHOT_VERSION" --no-configuration-cache

      - name: Summary
        if: steps.version.outputs.skip == 'false'
        env:
          SNAPSHOT_VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo "Published \`io.github.joaoseidel:ktor-toolkit-*:$SNAPSHOT_VERSION\`."
            echo
            echo '```kotlin'
            echo 'repositories {'
            echo '    maven("https://central.sonatype.com/repository/maven-snapshots/")'
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
