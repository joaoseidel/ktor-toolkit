name: Release

on:
  push:
    tags: [ "v*" ]

# Nothing here needs write access by default; the two jobs that do widen it themselves.
permissions:
  contents: read

# Two releases racing each other would fight over the same Central deployment, so an in-flight run
# is never cancelled — it is allowed to finish first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs before the environment gate, so an approver is only ever asked about a tag that already
  # builds, lints, keeps its public API and holds its coverage floor.
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # The tag is what consumers will resolve by, so it has to agree with the version the
      # jars are actually stamped with.
      - name: Check tag against gradle.properties
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match version=$version in gradle.properties"
            exit 1
          fi
          if [ -z "${version##*-SNAPSHOT}" ]; then
            echo "::error::Refusing to release a SNAPSHOT version ($version)"
            exit 1
          fi

      # Maven Central is append-only: a coordinate that already exists can never be replaced, so
      # finding out now beats finding out from a rejected deployment.
      - name: Check the version is unpublished
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          url="https://repo1.maven.org/maven2/io/github/joaoseidel/ktor-toolkit-cache/$version/"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          if [ "$code" = "200" ]; then
            echo "::error::io.github.joaoseidel:ktor-toolkit-cache:$version is already on Maven Central"
            exit 1
          fi
          echo "$version is unpublished (HTTP $code)"

      - name: Verify
        run: make verify

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-reports
          path: |
            **/build/reports/tests/test
            report/build/reports/kover
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify

    # Holds the Central credentials and the signing key. Add required reviewers to this
    # environment to make every release an explicit decision.
    environment:
      name: maven-central
      url: https://central.sonatype.com/namespace/io.github.joaoseidel

    permissions:
      contents: write      # cutting the GitHub release
      id-token: write      # OIDC token backing the provenance attestation
      attestations: write  # recording the attestation

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # Builds the jars and gathers them in build/dist. The same files are uploaded to Central,
      # attested and attached to the GitHub release, so all three describe one set of bytes.
      - name: Build and package
        run: make dist

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: make publish

      # Lets a consumer verify which workflow, at which commit, produced a given jar:
      #   gh attestation verify <jar> --repo joaoseidel/ktor-toolkit
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/dist/*.jar

      # Prefers the hand-written CHANGELOG section for this version and falls back to generated
      # notes when the tag has no section yet.
      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "notes=--notes-file release-notes.md" >> "$GITHUB_ENV"
          else
            echo "notes=--generate-notes" >> "$GITHUB_ENV"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # $notes is one intentional flag pair
          gh release create "$TAG" build/dist/*.jar \
            --title "$TAG" \
            --verify-tag \
            $notes
