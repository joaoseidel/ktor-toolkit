name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Check tag against gradle.properties
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match version=$version in gradle.properties"
            exit 1
          fi
          if [ -z "${version##*-SNAPSHOT}" ]; then
            echo "::error::Refusing to release a SNAPSHOT version ($version)"
            exit 1
          fi

      - name: Check the version is unpublished
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          url="https://repo1.maven.org/maven2/io/github/joaoseidel/ktor-toolkit-cache/$version/"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          if [ "$code" = "200" ]; then
            echo "::error::io.github.joaoseidel:ktor-toolkit-cache:$version is already on Maven Central"
            exit 1
          fi
          echo "$version is unpublished (HTTP $code)"

      - name: Verify
        run: make verify

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-reports
          path: |
            **/build/reports/tests/test
            report/build/reports/kover
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: maven-central
      url: https://central.sonatype.com/namespace/io.github.joaoseidel

    permissions:
      contents: write
      id-token: write      # OIDC token backing the provenance attestation
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build and package
        run: make dist

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: make publish

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/dist/*.jar

      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" build/dist/*.jar \
            --title "$TAG" \
            --verify-tag \
            "${notes[@]}"
