name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The tag is what consumers will resolve by, so it has to agree with the version the
      # jars are actually stamped with.
      - name: Check tag against gradle.properties
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match version=$version in gradle.properties"
            exit 1
          fi

      # Runs the full build — lint, tests, coverage gate and apiCheck — before collecting
      # the jars into build/dist.
      - name: Build and package
        run: make dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" build/dist/*.jar \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
