name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Lint
        run: make lint

      - name: Public API
        run: make api_check

      - name: Build and test
        run: make build

      - name: Coverage
        run: make coverage

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/test
            report/build/reports/kover
          if-no-files-found: ignore
          retention-days: 7

  publication:
    name: Publication
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Publish to Maven local
        run: make publish_local

      - name: Check the expected artifacts exist
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          failed=0
          for module in ktor-toolkit-*/; do
            module=${module%/}
            dir="$HOME/.m2/repository/io/github/joaoseidel/$module/$version"
            for suffix in .jar -sources.jar -javadoc.jar .pom; do
              file="$dir/$module-$version$suffix"
              if [ -s "$file" ]; then
                echo "ok   $module-$version$suffix"
              else
                echo "::error::missing or empty: $file"
                failed=1
              fi
            done
          done
          exit $failed
