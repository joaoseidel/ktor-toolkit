#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true
#Distribution
version=1.0.0
#Publishing
# Signing is mandatory on Maven Central. CI overrides this with -PsignAllPublications=false for the
# unsigned publishToMavenLocal smoke test, which has no key available.
signAllPublications=true
# The release workflow is already gated behind a protected environment, so the deployment does not
# also need a manual click in the Central Portal. Set to false to review each one by hand.
mavenCentralAutomaticPublishing=true
